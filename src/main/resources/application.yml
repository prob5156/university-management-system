spring:
  application:
    name: university-management-system

  # =============================================
  #  PROFILE: default (H2 — for local/IntelliJ)
  # =============================================
  profiles:
    active: ${SPRING_PROFILE:local}

---
# ---------- LOCAL profile (H2 in-memory DB) ----------
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:ums_db
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8080

---
# ---------- DOCKER profile (MySQL) ----------
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:ums_db}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080
